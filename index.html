<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

    <title>입트영 복습</title>
    <meta name="description" content="소리 내어 복습하는 개인용 문장 학습 노트" />

    <!-- 주소창 색: 라이트/다크 각각 paper 색 -->
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#EEF0EA" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#1B1D19" />

    <!-- iPadOS Safari 홈화면 추가용 -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="입트영" />
    <link rel="apple-touch-icon" href="%BASE_URL%icons/icon-192.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="%BASE_URL%icons/icon-192.png" />

    <!-- 웹폰트: 두 폰트 모두 안드로이드 기본 폰트가 아니라 반드시 불러와야 함 -->
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Pretendard: 동적 서브셋(필요한 글자만 내려받음) -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.css"
    />
    <!-- Noto Serif KR: 구글 폰트가 unicode-range로 자동 서브셋 -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;600;700&display=swap"
    />

    <script>
      // 첫 페인트 전에 테마를 적용해 화면이 번쩍이지 않게 한다.
      (function () {
        try {
          var t = localStorage.getItem('app.theme') || 'system'
          if (t === 'light' || t === 'dark') {
            document.documentElement.setAttribute('data-theme', t)
          }
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
